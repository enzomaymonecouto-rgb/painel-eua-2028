<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel PhD EUA 2028</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --line:#2a3038;
  --txt:#e6edf3; --mut:#8b949e; --accent:#58a6ff; --accent2:#bc8cff;
  --green:#3fb950; --greenbg:#12361f; --red:#f85149; --redbg:#3d1417;
  --yellow:#d29922; --yellowbg:#3a2d10;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;padding:24px}
.wrap{max-width:1400px;margin:0 auto}
header{margin-bottom:20px}
h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
h1 .em{color:var(--accent)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.modes{display:flex;gap:8px;margin:18px 0}
.mode-btn{background:var(--bg2);border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{background:var(--accent);color:#0d1117;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .v{font-size:26px;font-weight:700}
.card .l{color:var(--mut);font-size:12px;margin-top:2px}
.card.g .v{color:var(--green)} .card.y .v{color:var(--yellow)} .card.a .v{color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.controls input,.controls select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:8px 11px;border-radius:8px;font-size:13px}
.controls input{min-width:240px}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--accent)}
.count{color:var(--mut);font-size:12px;margin-left:auto}
.tbl-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:72vh}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--bg3);color:var(--mut);text-align:left;padding:10px 10px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);z-index:2}
thead th:hover{color:var(--txt)}
thead th .arr{opacity:.4;font-size:10px}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--bg3)}
tr.flip{background:var(--yellowbg)}
tr.flip:hover{background:#46380f}
.inst{font-weight:600;color:var(--txt)}
.prog{color:var(--mut);font-size:11.5px;display:block;margin-top:1px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill.sim{background:var(--greenbg);color:var(--green)}
.pill.nao{background:var(--redbg);color:var(--red)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:600}
.tag.req{background:var(--redbg);color:var(--red)}
.tag.pref{background:var(--yellowbg);color:var(--yellow)}
.tag.ok{background:var(--bg3);color:var(--mut)}
.tag.phd{background:#10243e;color:var(--accent)}
.tag.mfa{background:#241b3a;color:var(--accent2)}
.tag.flip{background:var(--yellow);color:#0d1117}
.small{color:var(--mut);font-size:11px;max-width:340px}
.corr{color:var(--accent)}
.legend{color:var(--mut);font-size:11.5px;margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
.legend b{color:var(--txt)}
.foot{color:var(--mut);font-size:11px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Painel <span class="em">PhD</span> · EUA 2028</h1>
  <div class="sub">Ranking por sobra real (stipend anual − custo de vida do casal). Funding 100%, sem GRE, BA aceito, intake Fall. <b>Não inclui renda da esposa.</b></div>
</header>

<div class="modes">
  <button class="mode-btn active" data-mode="base">Lista base · PhD</button>
  <button class="mode-btn" data-mode="ben">Cenário com benefícios</button>
</div>

<div class="cards" id="cards"></div>

<div class="controls" id="ctlBase">
  <input type="text" id="search" placeholder="Buscar instituição, cidade, programa...">
  <select id="fArea"><option value="">Todas as áreas</option></select>
  <select id="fTipo"><option value="">PhD + MFA</option><option>PhD</option><option>MFA</option></select>
  <select id="fViavel"><option value="">Viável: todos</option><option value="Sim">Só viáveis</option><option value="Nao">Só inviáveis</option></select>
  <select id="fMest"><option value="">Mestrado: todos</option><option value="nao">Não exige</option><option value="exige">Exige/Prefere</option></select>
  <span class="count" id="countBase"></span>
</div>

<div class="controls hidden" id="ctlBen">
  <input type="text" id="searchB" placeholder="Buscar instituição, cidade...">
  <select id="fViavelB"><option value="">Viável ajustado: todos</option><option value="Sim">Só viáveis</option><option value="Nao">Só inviáveis</option></select>
  <select id="fFlip"><option value="">Todos</option><option value="flip">Só os que VIRAM viáveis</option></select>
  <span class="count" id="countBen"></span>
</div>

<div class="tbl-wrap">
  <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<div class="legend" id="legend"></div>
<div class="foot" id="foot"></div>
</div>

const base = DATA.base, ben = DATA.ben;
const baseByN = {}; base.forEach(b=>baseByN[b.n]=b);
const fmt = n => (n===''||n==null)?'':Math.round(n).toLocaleString('en-US');
const pct = d => (d==null)?'':Math.round(d*100)+'%';
let mode='base', sortKey=null, sortDir=1;

// populate area filter
[...new Set(base.map(b=>b.area))].sort().forEach(a=>{
  const o=document.createElement('option');o.value=a;o.textContent=a;document.getElementById('fArea').appendChild(o);
});

function mestClass(m){ if(!m) return ['ok','—']; const s=(''+m).toLowerCase();
  if(s.startsWith('sim')||s.startsWith('bloq')) return ['req', m];
  if(s.startsWith('pref')) return ['pref', m]; return ['ok', m]; }

const COLS_BASE=[
 {k:'n',t:'#',num:1,r:row=>row.n},
 {k:'inst',t:'Instituição / programa',r:row=>`<span class="inst">${row.inst}</span><span class="prog">${row.prog||''}</span>`},
 {k:'cidade',t:'Cidade',r:row=>row.cidade},
 {k:'area',t:'Área',r:row=>`<span class="small">${row.area}</span>`},
 {k:'tipo',t:'Tipo',r:row=>`<span class="tag ${row.tipo==='PhD'?'phd':'mfa'}">${row.tipo}</span>`},
 {k:'stipend',t:'Stipend',num:1,r:row=>fmt(row.stipend)},
 {k:'meses',t:'Meses',num:1,r:row=>row.meses},
 {k:'sobra',t:'Sobra/ano',num:1,r:row=>`<span class="${row.sobra>=0?'pos':'neg'}">${fmt(row.sobra)}</span>`},
 {k:'deficit',t:'Déficit',num:1,r:row=>pct(row.deficit)},
 {k:'viavel',t:'Viável',r:row=>`<span class="pill ${row.viavel==='Sim'?'sim':'nao'}">${row.viavel}</span>`},
 {k:'mestrado',t:'Mestrado',r:row=>{const[c,l]=mestClass(row.mestrado);return `<span class="tag ${c}">${l}</span>`}},
 {k:'house_fam',t:'Moradia familiar (campus)',r:row=>`<span class="small">${row.house_fam||''}</span>`},
 {k:'house_rent',t:'Aluguel familiar aprox.',r:row=>`<span class="small">${row.house_rent||''}</span>`},
 {k:'obs',t:'Observações / risco',r:row=>`<span class="small">${row.obs||''}</span>`},
];
const COLS_BEN=[
 {k:'n',t:'#',num:1,r:row=>row.n},
 {k:'inst',t:'Instituição',r:row=>`<span class="inst">${row.inst}</span>`},
 {k:'tipo',t:'Tipo',r:row=>{const tp=(baseByN[row.n]||{}).tipo||'';return tp?`<span class="tag ${tp==='PhD'?'phd':'mfa'}">${tp}</span>`:'';}},
 {k:'cidade',t:'Cidade',r:row=>row.cidade},
 {k:'base',t:'Stipend base',num:1,r:row=>fmt(row.base)},
 {k:'corr',t:'Corrigido',num:1,r:row=>row.corr?`<span class="corr">${fmt(row.corr)}</span>`:''},
 {k:'summer',t:'+Verão/12m',num:1,r:row=>row.summer?`<span class="corr">+${fmt(row.summer)}</span>`:''},
 {k:'house',t:'+Moradia',num:1,r:row=>row.house?`<span class="corr">+${fmt(row.house)}</span>`:''},
 {k:'renda',t:'Renda aj.',num:1,r:row=>fmt(row.renda)},
 {k:'col_adj',t:'Custo aj.',num:1,r:row=>fmt(row.col_adj)},
 {k:'sobra_adj',t:'Sobra aj.',num:1,r:row=>`<span class="${row.sobra_adj>=0?'pos':'neg'}">${fmt(row.sobra_adj)}</span>`},
 {k:'viavel_adj',t:'Viável aj.',r:row=>{const f=isFlip(row); return `<span class="pill ${row.viavel_adj==='Sim'?'sim':'nao'}">${row.viavel_adj}</span>${f?' <span class="tag flip">novo</span>':''}`}},
 {k:'s_note',t:'Verão / 12 meses',r:row=>`<span class="small">${row.s_note||''}</span>`},
 {k:'h_note',t:'Moradia subsidiada',r:row=>`<span class="small">${row.h_note||''}</span>`},
];
function isFlip(row){ const b=baseByN[row.n]; return row.viavel_adj==='Sim' && b && b.viavel!=='Sim'; }

function getRows(){
  if(mode==='base'){
    let r=base.slice();
    const q=document.getElementById('search').value.toLowerCase();
    const a=document.getElementById('fArea').value, t=document.getElementById('fTipo').value;
    const v=document.getElementById('fViavel').value, m=document.getElementById('fMest').value;
    r=r.filter(x=>{
      if(q && !(`${x.inst} ${x.prog} ${x.cidade}`.toLowerCase().includes(q))) return false;
      if(a && x.area!==a) return false;
      if(t && x.tipo!==t) return false;
      if(v && x.viavel!==v) return false;
      if(m){ const s=(''+(x.mestrado||'')).toLowerCase(); const exige=s.startsWith('sim')||s.startsWith('bloq')||s.startsWith('pref');
        if(m==='nao' && exige) return false; if(m==='exige' && !exige) return false; }
      return true;
    });
    return r;
  } else {
    let r=ben.slice();
    const q=document.getElementById('searchB').value.toLowerCase();
    const v=document.getElementById('fViavelB').value, f=document.getElementById('fFlip').value;
    r=r.filter(x=>{
      if(q && !(`${x.inst} ${x.cidade}`.toLowerCase().includes(q))) return false;
      if(v && x.viavel_adj!==v) return false;
      if(f==='flip' && !isFlip(x)) return false;
      return true;
    });
    return r;
  }
}

function render(){
  const cols = mode==='base'?COLS_BASE:COLS_BEN;
  let rows=getRows();
  if(sortKey){
    rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];
      if(typeof x==='number'||typeof y==='number'){x=+x||0;y=+y||0;return (x-y)*sortDir;}
      return (''+x).localeCompare(''+y)*sortDir;});
  }
  const thead=document.getElementById('thead');
  thead.innerHTML='<tr>'+cols.map(c=>`<th data-k="${c.k}">${c.t} <span class="arr">${sortKey===c.k?(sortDir>0?'▲':'▼'):'⇅'}</span></th>`).join('')+'</tr>';
  thead.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=1;} render();});
  const tb=document.getElementById('tbody');
  tb.innerHTML=rows.map(row=>{
    const flip = mode==='ben' && isFlip(row);
    return `<tr class="${flip?'flip':''}">`+cols.map(c=>`<td class="${c.num?'num':''}">${c.r(row)}</td>`).join('')+'</tr>';
  }).join('');
  document.getElementById(mode==='base'?'countBase':'countBen').textContent=`${rows.length} programa(s)`;
  renderCards();
}

function renderCards(){
  const c=document.getElementById('cards');
  if(mode==='base'){
    const tot=base.length, vi=base.filter(b=>b.viavel==='Sim').length;
    const phd=base.filter(b=>b.tipo==='PhD').length, mfa=base.filter(b=>b.tipo==='MFA').length;
    const nomest=base.filter(b=>{const s=(''+(b.mestrado||'')).toLowerCase();return !(s.startsWith('sim')||s.startsWith('bloq')||s.startsWith('pref'));}).length;
    c.innerHTML=card(tot,'vagas no total')+card(vi,'viáveis (déficit ≤30%)','g')+card(phd+' / '+mfa,'PhD / MFA','a')+card(nomest,'não exigem mestrado');
  } else {
    const tot=ben.length, vi=ben.filter(b=>b.viavel_adj==='Sim').length, fl=ben.filter(isFlip).length;
    c.innerHTML=card(tot,'no top 37')+card(vi,'viáveis no cenário','g')+card('+'+fl,'que VIRAM viáveis','y')+card(17+'→'+vi,'salto de viáveis','a');
  }
}
const card=(v,l,cls='')=>`<div class="card ${cls}"><div class="v">${v}</div><div class="l">${l}</div></div>`;

function renderLegendFoot(){
  if(mode==='base'){
    document.getElementById('legend').innerHTML=
      '<span><b>Sobra/ano</b>: stipend − custo do casal (modesto, 1BR, sem saúde/mensalidade).</span>'+
      '<span><b>Viável</b>: déficit ≤ 30% do stipend.</span>'+
      '<span><span class="tag req">vermelho</span> exige mestrado · <span class="tag pref">amarelo</span> prefere · <span class="tag ok">cinza</span> BA aceito</span>';
    document.getElementById('foot').textContent='Estimativas de custo de vida ~2025. Stipends de 9 meses são cenário conservador (pior caso, sem verão). Confirme cada valor com o programa.';
  } else {
    document.getElementById('legend').innerHTML=
      '<span><span class="tag flip">novo</span> / linha amarela: passou a viável com os benefícios.</span>'+
      '<span><b>Azul</b>: correção de stipend, verão/12m ou economia de moradia adicionados.</span>';
    document.getElementById('foot').textContent='Cenário conservador: economia de moradia subtraída do custo onde há moradia familiar/pós abaixo do mercado; verão creditado só com evidência. Correções: Northwestern $47.748, Johns Hopkins $40.520, Buffalo $30.797 (12 meses). Não inclui renda da esposa.';
  }
}

document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); mode=b.dataset.mode; sortKey=null;
  document.getElementById('ctlBase').classList.toggle('hidden',mode!=='base');
  document.getElementById('ctlBen').classList.toggle('hidden',mode!=='ben');
  render(); renderLegendFoot();
});
['search','fArea','fTipo','fViavel','fMest'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',render);e.addEventListener('change',render);});
['searchB','fViavelB','fFlip'].forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',render);e.addEventListener('change',render);});
render(); renderLegendFoot();
</script>
</body>
</html>
